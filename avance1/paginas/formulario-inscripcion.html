<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Hub - Inicio</title>

    <!-- CSS de Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS propio compilado desde Sass -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark encabezado-principal">
            <div class="container">
                <a class="navbar-brand fs-3" href="/innovation-hub/avance1/index.html"><i
                        class="fa-regular fa-lightbulb fa-xl logo-icon"></i> Innovation Hub</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación de palanca">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="/innovation-hub/avance1/index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="/innovation-hub/avance1/paginas/catalogo.html">Iniciativas</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="/innovation-hub/avance1/paginas/nueva-iniciativa.html">Publicar</a></li>
                        <li class="nav-item position-relative btn-user">
                            <a class="d-lg-none nav-link" href="/innovation-hub/avance1/paginas/perfil.html">Mi
                                Perfil</a>
                            <a href="/innovation-hub/avance1/paginas/perfil.html"><button type="button"
                                    class="btn btn-outline-primary btn-user  d-none d-lg-inline"
                                    aria-label="Opciones de usuario" data-bs-toggle="collapse"
                                    data-bs-target="#login-opciones"><i class="fa-solid fa-circle-user fa-2xl"
                                        aria-hidden="true"></i></button></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container-fluid my-4">
        <form class="d-flex flex-column gap-3 formulario-inscripcion" novalidate>
            <h2>Solicitud de inscripción</h2>
            <h3 id="titulo"></h3>
            <div class="d-flex flex-column">
                <label for="mensaje">Mensaje de presentación</label>
                <textarea id="mensaje" name="story" rows="5" cols="33"></textarea>
            </div>
            <div class="d-flex flex-column">
                <label for="competencia">Competencia Principal</label>
                <input type="text" id="competencia">
            </div>
            <div class="d-flex flex-column">
                <label for="rol">Rol Deseado</label>
                <input type="text" id="rol">
            </div>
            <div class="d-flex flex-column">
                <label for="disponibilidad">Disponibilidad</label>
                <input type="text" id="disponibilidad">
            </div>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <!-- Pie de Página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Universidad CENFOTEC - Innovation Hub</p>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/formulario-inscripcion.js"></script>
</body>

</html>
