<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Hub - Inicio</title>

    <!-- CSS de Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS propio compilado desde Sass -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <!-- Barra de Navegación -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/innovation-hub/avance1/index.html">Innovation Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación de palanca">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="/innovation-hub/avance1/index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="/innovation-hub/avance1/paginas/catalogo.html">Iniciativas</a></li>
                        <li class="nav-item"><a class="nav-link" href="/innovation-hub/avance1/paginas/">Publicar</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="/innovation-hub/avance1/paginas/perfil.html">Mi
                                Perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid d-flex flex-column">
        <div class="row flex-grow-1">
            <section class="col-12 col-md-9 mt-2 d-flex flex-column justify-content-evenly justify-content-md-start gap-1">
                <h2 class="titulo-iniciativa" id="titulo"></h2>
                <p class="autor-iniciativa">Por <span id="propietario"></span></p>
                <p class="descripcion-iniciativa" id="descripcion"></p>
                <div class="contenedor-competencias">
                    <p class="etiqueta">Competencias Requeridas</p>
                    <div class="d-flex gap-3 flex-wrap" id="competencias"></div>
                </div>              
            </section>

            <aside class="col-12 col-md-3 caracteristicas-iniciativa d-flex flex-column justify-content-evenly">
                <div class="contenedor-tipo">
                    <p class="etiqueta">Tipo</p>
                    <p id="tipo"></p>
                </div>
                <div class="contenedor-categoria">
                    <p class="etiqueta">Categoría</p>
                    <p id="categoria"></p>
                </div>
                <div class="contenedor-estado">
                    <p class="etiqueta">Estado</p>
                    <p id="estado"></p>
                </div>
                <div class="contenedor-visibilidad">
                    <p class="etiqueta">Nivel de Visibilidad</p>
                    <p id="visibilidad"></p>
                </div>
                <div class="contenerdor-miembros">
                    <p class="etiqueta">Miembros</p>
                    <div class="d-flex gap-3 flex-wrap" id="miembros"></div>
                </div>
            </aside>
        </div>
    </main>


    <!-- Pie de Página -->
    <footer class="bg-dark text-white text-center py-3 mt-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 Universidad CENFOTEC - Innovation Hub</p>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/detalle-iniciativa.js"></script>
</body>

</html>
