<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- CSS propio compilado desde Sass -->
  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark encabezado-principal">
      <div class="container">
        <a class="navbar-brand fs-3" href="/innovation-hub/avance1/index.html"><i
            class="fa-regular fa-lightbulb fa-xl logo-icon"></i> Innovation Hub</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Navegación de palanca">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page"
                href="/innovation-hub/avance1/index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link"
                href="/innovation-hub/avance1/paginas/catalogo.html">Iniciativas</a></li>
            <li class="nav-item"><a class="nav-link"
                href="/innovation-hub/avance1/paginas/nueva-iniciativa.html">Publicar</a></li>
            <li class="nav-item position-relative btn-user">
              <a class="d-lg-none nav-link" href="/innovation-hub/avance1/paginas/perfil.html">Mi Perfil</a>
              <a href="/innovation-hub/avance1/paginas/perfil.html"><button type="button"
                  class="btn btn-outline-primary btn-user  d-none d-lg-inline" aria-label="Opciones de usuario"
                  data-bs-toggle="collapse" data-bs-target="#login-opciones"><i class="fa-solid fa-circle-user fa-2xl"
                    aria-hidden="true"></i></button></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h2 class="fw-bold mb-4 text-primary">Registrar Nueva Iniciativa</h2>

        <form id="formIniciativa" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="titulo" class="form-label fw-semibold">Título de la Iniciativa *</label>
            <input type="text" class="form-control" id="titulo" required minlength="5">
            <div class="invalid-feedback">Ingresa un título válido (mínimo 5 caracteres).</div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="tipo" class="form-label fw-semibold">Tipo *</label>
              <select class="form-select" id="tipo" required>
                <option value="" selected disabled>Seleccionar...</option>
                <option value="Idea">Idea</option>
                <option value="Necesidad">Necesidad</option>
                <option value="Reto">Reto</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="categoria" class="form-label fw-semibold">Categoría *</label>
              <select class="form-select" id="categoria" required>
                <option value="" selected disabled>Seleccionar...</option>
                <option value="Educación">Educación</option>
                <option value="Tecnología">Tecnología</option>
                <option value="Infraestructura">Infraestructura</option>
                <option value="Sostenibilidad">Sostenibilidad</option>
                <option value="Seguridad">Seguridad</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="visibilidad" class="form-label fw-semibold">Nivel de Visibilidad *</label>
            <select class="form-select" id="visibilidad" required>
              <option value="" selected disabled>Seleccionar...</option>
              <option value="Pública">Pública (Visible para todos)</option>
              <option value="Comunidad interna">Comunidad interna (Solo usuarios registrados)</option>
              <option value="Restringida">Restringida (Ver solo resumen)</option>
              <option value="Privada">Privada (Solo el creador)</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="resumen" class="form-label fw-semibold">Resumen Ejecutivo *</label>
            <textarea class="form-control" id="resumen" rows="2" maxlength="150" required></textarea>
            <div class="form-text">Máximo 150 caracteres.</div>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold">Descripción Detallada *</label>
            <textarea class="form-control" id="descripcion" rows="4" required></textarea>
          </div>

          <div class="mb-3">
            <label for="objetivos" class="form-label fw-semibold">Objetivos de la Propuesta *</label>
            <textarea class="form-control" id="objetivos" rows="2" required></textarea>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="requiereParticipantes">
            <label class="form-check-label fw-semibold" for="requiereParticipantes">
              ¿Requiere colaboradores o participantes adicionales?
            </label>
          </div>

          <!-- Selección dinámica de competencias -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Competencias Requeridas</label>
            <div class="input-group mb-2">
              <input type="text" id="nuevaCompetenciaInput" class="form-control" placeholder="Ej. Diseño UX/UI">
              <button class="btn btn-outline-secondary" type="button" id="btnAgregarCompetencia">Agregar</button>
            </div>
            <div id="listaCompetenciasBadge" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Guardar Iniciativa</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 Universidad CENFOTEC - Innovation Hub</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/validaciones.js"></script>
</body>

</html>
